services:
  - type: web
    name: mse-graph-proxy
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PROXY_TOKEN
        generateValue: true          # copy it from the Render dashboard into MSE_PROXY_TOKEN
      - key: ALLOWED_HOSTS
        value: mse.mn,opendatalab.mn
      - key: PYTHON_VERSION
        value: 3.12.8
