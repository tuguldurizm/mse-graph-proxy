<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSE Connections</title>
<script src="/static/vendor/vis-network.min.js"></script>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc;
          --company:#2f6fb2; --person:#c46a1c; --org:#5b8a3a; --accent:#2f6fb2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --panel:#1f1f1d; --ink:#ecebe6; --muted:#9a9993; --line:#33332f;
            --company:#6aa3e0; --person:#e89a55; --org:#8fbf6b; --accent:#6aa3e0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink);
         display:grid; grid-template-columns: 360px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:16px; }
  main { position:relative; }
  #net { position:absolute; inset:0; }
  h1 { font-size:17px; margin:0 0 4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:18px 0 6px; }
  .stats { color:var(--muted); font-size:12px; }
  input, select, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line);
                          border-radius:6px; padding:6px 8px; }
  input { width:100%; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:5px 6px; border-radius:5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  li:hover { background:var(--bg); }
  .tag { font-size:11px; padding:1px 6px; border-radius:10px; color:#fff; flex-shrink:0; align-self:center; }
  .Company { background:var(--company); } .Person { background:var(--person); } .Organization { background:var(--org); }
  .meta { color:var(--muted); font-size:12px; }
  .legend { position:absolute; top:12px; right:12px; background:var(--panel); border:1px solid var(--line);
            border-radius:8px; padding:8px 10px; font-size:12px; display:flex; gap:10px; }
  .legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%;
                         margin-right:4px; background:var(--c); }
  #pathFrom, #pathTo { font-size:12px; }
  .scroll { overflow-x:auto; }
  table.hist { border-collapse:collapse; font-size:12px; width:100%; }
  table.hist th, table.hist td { padding:3px 5px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  table.hist th:first-child, table.hist td:first-child { text-align:left; white-space:normal; min-width:120px; }
  table.hist th { color:var(--muted); font-weight:normal; }
  .up { color:#2e8540; } .down { color:#c0392b; }
  @media (prefers-color-scheme: dark) { .up { color:#6cc77f; } .down { color:#f0776a; } }
  .chg { display:block; }
  .chg .meta { display:block; }
  .rf { display:block; padding:5px 6px 5px 10px; margin:3px 0; border-left:3px solid var(--line); border-radius:0 5px 5px 0; }
  .rf.warn { border-left-color:#d08a1e; background:color-mix(in srgb, #d08a1e 10%, transparent); }
  .group { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; cursor:default; padding-top:10px; }
  .group:hover { background:none; }
  .acts { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  .acts button { font-size:12px; padding:2px 7px; }
  .rv { display:block; cursor:default; }
  .rv:hover { background:none; }
  .rv .name { cursor:pointer; color:var(--accent); }
  .cov { color:var(--muted); font-size:11px; cursor:default; display:block; padding:2px 6px 6px; }
  .cov:hover { background:none; }
  .rf.error { border-left-color:#c0392b; background:color-mix(in srgb, #c0392b 10%, transparent); }
  .sorts { display:flex; gap:4px; flex-wrap:wrap; cursor:default; }
  .sorts:hover { background:none; }
  .sorts button { font-size:12px; padding:2px 7px; }
  .spark { display:block; width:100%; height:44px; color:var(--accent); }
  .spark .axis { stroke:var(--line); }
  .sorts button.on { border-color:var(--accent); color:var(--accent); }
  .flag { font-size:11px; padding:0 5px; border-radius:8px; border:1px solid var(--accent); color:var(--accent); margin-left:4px; }
  @media (max-width: 760px) { body { grid-template-columns:1fr; grid-template-rows: 45vh 55vh; } aside { order:2; } }
</style>
</head>
<body>
<aside>
  <h1>MSE холбоосын граф</h1>
  <div class="stats" id="stats">…</div>
  <div class="stats" id="pipeline"></div>

  <h2>Хайх / Search</h2>
  <input id="q" placeholder="Компани, тикер, хүний нэр…" autocomplete="off">
  <ul id="results"></ul>

  <h2>Харах / View</h2>
  <div class="row">
    <button id="btnOverview">Зах зээлийн тойм</button>
    <select id="depth"><option value="1">1 алхам</option><option value="2" selected>2 алхам</option><option value="3">3 алхам</option></select>
    <select id="sizeBy" title="Зангилааны хэмжээ (issue #29)"><option value="">Хэмжээ: ижил</option><option value="betweenness">Хэмжээ: зуучлал</option><option value="pagerank">Хэмжээ: PageRank</option><option value="degree">Хэмжээ: компанийн тоо</option><option value="market_cap">Хэмжээ: зах зээлийн үнэлгээ</option></select>
  </div>

  <h2>Холбоос олох / Path</h2>
  <div id="pathFrom" class="meta">A: — (сонгоод "A" дарна)</div>
  <div id="pathTo" class="meta">B: —</div>
  <div class="row"><button id="setA">A болгох</button><button id="setB">B болгох</button><button id="findPath">Зам олох</button></div>

  <h2>Дэлгэрэнгүй / Details</h2>
  <div id="details" class="meta">Зангилаа сонгоно уу.</div>

  <h2>Шинжилгээ / Analysis</h2>
  <div class="row">
    <button data-a="interlocks">Олон компанид ажилладаг хүмүүс</button>
    <button data-a="common-owners">Нийтлэг эзэмшигчид</button>
    <button data-a="board-overlap">ТУЗ давхцал</button>
    <button data-a="moves">Компани сольсон хүмүүс</button>
    <button id="btnChanges">Сүүлийн өөрчлөлтүүд</button>
  </div>
  <div class="row">
    <button data-g="structure">Тойрог / хөндлөн эзэмшил</button>
    <button data-g="conflicts">Ашиг сонирхлын зөрчил</button>
    <button data-g="state">Төрийн оролцоо</button>
    <button id="btnReview">Нэгтгэлийн хяналт / Review</button>
  </div>
  <div class="row">
    <button id="btnConc">Эзэмшлийн төвлөрөл</button>
    <button id="btnQuality">Өгөгдлийн чанар</button>
  </div>
  <div class="row">
    <button id="btnGroups">Хяналтын бүлэг</button>
    <button id="btnCommunities">Илрүүлсэн бүлгүүд</button>
    <button id="btnCentrality">Гол зангилаа / Brokers</button>
  </div>
  <div class="row">
    <button id="btnTurnover">Удирдлагын солилцоо</button>
    <button id="btnAccum">Хувьцаа хуримтлуулалт</button>
    <button id="btnTrends">Зах зээлийн чиг хандлага</button>
  </div>
  <div class="row">
    <button id="btnMarket">Ханш, зах зээлийн үнэлгээ</button>
  </div>
  <ul id="analysis"></ul>
</aside>
<main>
  <div id="net"></div>
  <div class="legend">
    <span style="--c:var(--company)">Компани</span>
    <span style="--c:var(--person)">Хувь хүн</span>
    <span style="--c:var(--org)">Байгууллага</span>
  </div>
</main>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// holding types other than direct (issue #39): nominee = held for clients, treasury = own shares
const HOLD_TAG = { nominee: 'номини', treasury: 'өөрийн хувьцаа', unknown: 'төрөл тодорхойгүй' };
const holdTag = x => HOLD_TAG[x.holding_type] ? ` <span class="meta">${HOLD_TAG[x.holding_type]}</span>` : '';
const COLORS = () => ({ Company: css('--company'), Person: css('--person'), Organization: css('--org') });
const api = (p) => fetch(p).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const nodes = new vis.DataSet(), edges = new vis.DataSet();
const network = new vis.Network(document.getElementById('net'), { nodes, edges }, {
  physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -60, springLength: 110 },
             stabilization: { iterations: 200 } },
  interaction: { hover: true, tooltipDelay: 120 },
  edges: { arrows: { to: { enabled: true, scaleFactor: .5 } }, smooth: { type: 'continuous' },
           font: { size: 10, color: css('--muted'), strokeWidth: 0 } },
  nodes: { font: { color: css('--ink'), size: 13 } },
});
let selected = null, pathA = null, pathB = null, lastDraw = null;
// node size by a centrality score (issue #29): 12 px, up to 12 + 36 px for the largest score in view
const CEN_FIELD = { betweenness: 'centrality_betweenness', pagerank: 'centrality_pagerank', degree: 'centrality_degree',
                    market_cap: 'market_cap' };   // market cap (issue #31): companies without one stay small
// MNT amounts as people say them: 1.23 тэрбум ₮ (issue #31)
const fmtMNT = v => v == null ? '—' : Math.abs(v) >= 1e12 ? `${(v / 1e12).toFixed(2)} их наяд ₮` : Math.abs(v) >= 1e9 ? `${(v / 1e9).toFixed(2)} тэрбум ₮`
  : Math.abs(v) >= 1e6 ? `${(v / 1e6).toFixed(1)} сая ₮` : `${Math.round(v).toLocaleString('en-US')} ₮`;
function nodeSizes(list) {
  const f = CEN_FIELD[document.getElementById('sizeBy').value];
  if (!f) return null;
  const v = n => Math.max(0, f === 'centrality_pagerank' ? (n[f] || 1) - 1 : (n[f] || 0));
  const max = Math.max(...list.map(v), 0);
  return n => 12 + (max > 0 ? 36 * Math.sqrt(v(n) / max) : 0);
}

function draw(data, { replace = true, focus = null } = {}) {
  const col = COLORS();
  if (replace) { nodes.clear(); edges.clear(); lastDraw = { nodes: [], edges: [] }; }
  lastDraw.nodes.push(...data.nodes); lastDraw.edges.push(...data.edges);
  const sz = nodeSizes(lastDraw.nodes), cen = n => n.centrality_degree == null ? '' :
    `\nкомпани ${n.centrality_degree} · зуучлал ${(100 * n.centrality_betweenness).toFixed(1)}% · PageRank ${(+n.centrality_pagerank).toFixed(2)}`;
  nodes.update(data.nodes.map(n => ({
    id: n.key, label: n.ticker && !n.ticker.startsWith('~') ? `${n.ticker}\n${n.name}` : n.name, type: n.type,
    shape: n.type === 'Company' ? 'box' : 'dot', size: sz ? sz(n) : 12,
    font: n.type === 'Company' ? { color: '#fff', size: sz ? Math.round(sz(n) * 0.55 + 6) : 13 } : undefined,
    color: { background: col[n.type], border: col[n.type], highlight: { background: col[n.type], border: css('--ink') } },
    title: `${n.type}: ${n.name}${cen(n)}${n.market_cap != null ? `\nзах зээлийн үнэлгээ ${fmtMNT(n.market_cap)}` : ''}`,
  })));
  edges.update(data.edges.filter(Boolean).map(e => ({
    id: `${e.source}|${e.type}|${e.target}|${e.title || ''}`, from: e.source, to: e.target,
    label: e.type === 'OWNS' ? (e.percent != null ? `${e.percent}%` : 'эзэмшил') + (HOLD_TAG[e.holding_type] ? ` (${HOLD_TAG[e.holding_type]})` : '')
         : e.type === 'BENEFICIAL_OWNER' ? 'эцсийн өмчлөгч' : (e.title || ''),
    dashes: e.type === 'HOLDS_POSITION' ? true : e.type === 'BENEFICIAL_OWNER' ? [2, 4]
          : HOLD_TAG[e.holding_type] ? [6, 3] : false,   // held for clients / own shares: not ownership
    width: e.type === 'OWNS' ? 1 + Math.min(6, (e.percent || 0) / 10) : 1,
    color: { color: e.type === 'HOLDS_POSITION' ? css('--person') : HOLD_TAG[e.holding_type] ? css('--muted') : css('--company'),
             opacity: .7 },
  })));
  if (focus) setTimeout(() => network.focus(focus, { scale: 1, animation: true }), 300);
}

async function open(key) {
  selected = key;
  const depth = document.getElementById('depth').value;
  const [g, d] = await Promise.all([
    api(`/api/graph/neighborhood?key=${encodeURIComponent(key)}&depth=${depth}`),
    api(`/api/entity?key=${encodeURIComponent(key)}`),
  ]);
  // an old link (company:APU, company:~2702673) resolves to the node's current key
  key = selected = (d && d.entity && d.entity.key) || key;
  draw(g, { focus: key });
  network.selectNodes([key]);
  showDetails(d);
}

function list(title, items, fmt) {
  if (!items || !items.length) return '';
  return `<h2>${title}</h2><ul>${items.map(i => `<li${i.key ? ` data-key="${esc(i.key)}"` : ''}>${fmt(i)}</li>`).join('')}</ul>`;
}
// company facts (issue #38), as the panel and the change list name them
const FACT_LABELS = {name: 'Нэр', name_en: 'Англи нэр', address: 'Хаяг', legal_form: 'Хэлбэр',
                     sector: 'Салбар', activity_codes: 'Үйл ажиллагааны код'};

async function showDetails(d) {
  const e = d.entity, isCo = e.type === 'Company', t = encodeURIComponent(e.ticker || '');
  // Company extras load in parallel; the flags go right under the company facts.
  const [uo, hist, chg, flags, conc, turn, mk] = await Promise.all(isCo ? [
    api(`/api/companies/${t}/ultimate-owners`),
    api(`/api/companies/${t}/ownership-history`).catch(() => null),
    api(`/api/changes?ticker=${t}&limit=30`).catch(() => []),
    api(`/api/companies/${t}/flags`).catch(() => []),
    api(`/api/companies/${t}/concentration`).catch(() => null),
    api(`/api/companies/${t}/turnover`).catch(() => null),
    api(`/api/companies/${t}/market`).catch(() => null),
  ] : [[], null, api(`/api/changes?key=${encodeURIComponent(e.key)}&limit=30`).catch(() => []), [], null, null, null]);

  let html = `<div><b style="color:var(--ink)">${esc(e.name)}</b> <span class="tag ${e.type}">${e.type}</span></div>`;
  for (const [k, label] of [['ticker','Тикер'],['name_en','English'],['sector','Салбар'],['register_no','Регистр'],
                            ['legal_form','Хэлбэр'],['founded','Үүсгэн байгуулагдсан'],['address','Хаяг']])
    if (e[k]) html += `<div>${label}: ${esc(e[k])}</div>`;
  // standard sector from the registry's main activity code (ISIC section), when it differs from the text
  if (e.sector_std && e.sector_std_name !== e.sector)
    html += `<div>Стандарт салбар: ${esc(e.sector_std)} · ${esc(e.sector_std_name)}</div>`;
  if (e.activities && e.activities.length)
    html += `<div>Үйл ажиллагаа: <span class="meta">${e.activities.map(esc).join('; ')}</span></div>`;
  if (e.former_names && e.former_names.length)
    html += `<div>Хуучин нэр: ${e.former_names.map(esc).join(', ')}</div>`;
  const links = [];
  if (e.url && /^https?:/.test(e.url)) links.push(`<a href="${esc(e.url)}" target="_blank" rel="noopener">mse.mn</a>`);
  if (e.registry_url && /^https?:/.test(e.registry_url))
    links.push(`<a href="${esc(e.registry_url)}" target="_blank" rel="noopener">Open Data Lab</a>` +
               (e.registry_updated ? ` <span class="meta">(${esc(e.registry_updated)})</span>` : ''));
  if (links.length) html += `<div>${links.join(' · ')}</div>`;
  html += marketBlock(mk);
  if (flags.length) html += `<h2>Анхаарах зүйлс</h2><ul>${flags.map(f =>
    `<li class="rf ${f.level}" data-key="${esc(f.keys[0] || '')}">${esc(f.text)}</li>`).join('')}</ul>`;
  const pct = p => p != null ? `${p}%` : '';
  // a stake's MNT value (issue #31): percent × the market cap of the company it is in
  const val = x => x.value_mnt != null ? ` <span class="meta" title="эзэмшлийн хувь × зах зээлийн үнэлгээ">≈ ${fmtMNT(x.value_mnt)}</span>` : '';
  // unlisted companies (subsidiaries, registry holders) have internal '~...' tickers: show their name
  const co = x => x.ticker && !x.ticker.startsWith('~') ? x.ticker : x.name;
  const reg = o => o.percent == null && /^https?:\/\/(www\.)?opendatalab\.mn/.test(o.source || '') ? '<span class="meta">бүртгэл</span>' : '';
  html += list('Хувьцаа эзэмшигчид', d.owners, o => `<span>${esc(o.name)}${holdTag(o)}${o.share_class && o.share_class !== 'common' ? ` <span class="meta">${esc(o.share_class)}</span>` : ''}</span><span>${pct(o.percent)}${reg(o)}${val(o)}</span>`);
  const own = d.ownership;
  if (own && (own.nominee.holders || own.treasury.holders))
    html += `<div class="meta">Номини эзэмшил: ${own.nominee.holders} (${own.nominee.percent != null ? fmtPct(own.nominee.percent) : '?'})` +
            (own.treasury.holders ? ` · өөрийн хувьцаа: ${own.treasury.percent != null ? fmtPct(own.treasury.percent) : '?'}` : '') + '</div>';
  html += concBlock(conc);
  html += turnoverBlock(turn);
  html += list('Эцсийн өмчлөгч (бүртгэл)', d.beneficial_owners,
               b => `<span>${esc(b.name)}</span><span class="meta">${esc(b.since || '')}</span>`);
  html += list('Эцсийн өмчлөгч болох компаниуд', d.beneficially_owns,
               b => `<span>${esc(co(b))}</span><span class="meta">${esc(b.since || '')}</span>`);
  html += list('Удирдлага / ТУЗ', d.people, p => `<span>${esc(p.name)}</span><span class="meta">${esc(p.title)}</span>`);
  html += list('Эзэмшдэг компаниуд', d.holdings, h => `<span>${esc(co(h))}${holdTag(h)}</span><span>${pct(h.percent)}${val(h)}</span>`);
  if (d.holdings_value_mnt != null)
    html += `<div class="meta">Эзэмшлийн нийт үнэлгээ ≈ ${fmtMNT(d.holdings_value_mnt)} (${d.holdings_valued} компани, зах зээлийн үнэлгээгээр; шууд эзэмшил)</div>`;
  html += list('Албан тушаал', d.positions, p => `<span>${esc(p.ticker)}</span><span class="meta">${esc(p.title)}</span>`);
  // ended links (people who left, stakes sold or resized), most recent first
  const h = d.history || {};
  const period = i => `<span class="meta" style="white-space:nowrap">${esc(i.since || i.first_seen || '?')} – ${esc(i.until || '?')}</span>`;
  html += list('Өмнөх удирдлага / ТУЗ', h.people,
               p => `<span>${esc(p.name)} <span class="meta">${esc(p.title)}</span></span>${period(p)}`);
  html += list('Өмнөх хувьцаа эзэмшигчид', h.owners,
               o => `<span>${esc(o.name)} ${pct(o.percent)}</span>${period(o)}`);
  html += list('Өмнө эзэмшиж байсан', h.holdings,
               x => `<span>${esc(co(x))} ${pct(x.percent)}</span>${period(x)}`);
  html += list('Өмнөх эцсийн өмчлөгч (бүртгэл)', h.beneficial_owners,
               b => `<span>${esc(b.name)}</span>${period(b)}`);
  html += list('Өмнөх мэдээлэл (нэр, хаяг, ...)', h.facts,
               f => `<span>${esc(FACT_LABELS[f.name] || f.name)}: ${esc(f.value)} <span class="meta">${esc(f.source)}</span></span>` +
                    `<span class="meta" style="white-space:nowrap">${esc(f.first_seen || '?')} – ${esc(f.until || '?')}</span>`);
  html += list('Өмнөх албан тушаал', h.positions,
               p => `<span>${esc(p.ticker)} <span class="meta">${esc(p.title)}</span></span>${period(p)}`);
  html += list('Холбоотой компаниуд', d.related_companies,
               r => `<span>${esc(r.ticker)} ${esc(r.name)}</span><span class="meta">${[...new Set(r.links.map(l => l.name))].map(esc).join(', ')}</span>`);
  html += list('Эцсийн өмчлөгчид (look-through)', uo,
               u => `<span>${esc(u.name)}</span><span>${u.effective_percent}%</span>`);
  html += historyTable(hist);
  html += changeList('Өөрчлөлтүүд', chg, !isCo);
  document.getElementById('details').innerHTML = html;
}

// ---- change history ----------------------------------------------------------
const fmtPct = v => v == null ? '?' : `${+v.toFixed(3)}%`;
function describe(c) {
  const who = esc(c.entity || ''), flag = (c.crossed || []).map(t => `<span class="flag">${t}%</span>`).join('');
  const d = c.delta != null ? ` <span class="${c.delta > 0 ? 'up' : 'down'}">(${c.delta > 0 ? '+' : ''}${+c.delta.toFixed(3)})</span>` : '';
  switch (c.kind) {
    case 'stake_changed':    return `${who}: ${fmtPct(c.old)} → ${fmtPct(c.new)}${d}${flag}`;

async function decide(payload) {
  if (rvStatus && !rvStatus.writable) return alert('Шийдвэр гаргах боломжгүй: серверт REVIEW_PASSWORD тохируулаагүй.');
  let pw = null;
  try { pw = sessionStorage.getItem('reviewPassword'); } catch {}
  if (!pw) { pw = prompt('Хяналтын нууц үг (REVIEW_PASSWORD):'); if (!pw) return; }
  if (payload.action !== 'dismiss' && payload.action !== 'keep_apart') {
    const what = payload.action === 'merge' ? `${payload.key} → ${payload.into}`
               : payload.action === 'split' ? `${payload.key}: ${payload.companies.join(', ')} тусдаа` : payload.id;
    if (!confirm(`${payload.action}: ${what}?`)) return;
  }
  const note = payload.action === 'revoke' ? '' : (prompt('Тайлбар (заавал биш):') || '');
  const r = await fetch('/api/review/decide', {method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Review-Password': pw}, body: JSON.stringify({...payload, note})});
  if (r.status === 401) { try { sessionStorage.removeItem('reviewPassword'); } catch {} return alert('Нууц үг буруу.'); }
  if (!r.ok) return alert(`Алдаа: ${(await r.json().catch(() => ({}))).detail || r.status}`);
  try { sessionStorage.setItem('reviewPassword', pw); } catch {}
  await showReview();
}

// one small line chart per metric; the date range under each
function spark(pts, k) {
  const vs = pts.map(p => p[k]).filter(v => v != null);
  if (!vs.length) return '<div class="meta">өгөгдөл алга</div>';
  const W = 260, H = 40, lo = Math.min(...vs), hi = Math.max(...vs), n = pts.length;
  const ts = pts.map(p => Date.parse(p.date)), t0 = ts[0], t1 = ts[n - 1];   // a time axis: scrapes are uneven
  const x = i => n < 2 || t1 === t0 ? W / 2 : 4 + (W - 8) * (ts[i] - t0) / (t1 - t0), y = v => hi === lo ? H / 2 : H - 4 - (H - 8) * (v - lo) / (hi - lo);
  const line = pts.map((p, i) => p[k] == null ? null : `${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).filter(Boolean).join(' ');
  const last = pts.map((p, i) => [i, p[k]]).filter(([, v]) => v != null).pop();
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">` +
    `<line class="axis" x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}"/>` +
    `<polyline points="${line}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>` +
    `<circle cx="${x(last[0])}" cy="${y(last[1])}" r="3" fill="currentColor"/></svg>`;
}

  interlocks: 'Олон компанитай холбоотой хүн', cross_holdings: 'Бүртгэлтэй компаниудын хөндлөн эзэмшил',
  median_hhi: 'Медиан HHI (төвлөрөл)', with_holdings: 'Эзэмшлийн мэдээлэлтэй компани', officers: 'Албан тушаал (бүртгэлтэй компани)' };

    `<span class="meta">${esc(m.price_date || '')} арилжаа${m.price_as_of && m.price_as_of !== m.price_date ? ` · ${esc(m.price_as_of)}-нд уншсан` : ''}</span>${stale}</div>` +
    `<div>Зах зээлийн үнэлгээ: <b>${fmtMNT(m.market_cap)}</b>${basis}</div>` +

    document.getElementById('stats').textContent =
      `${s.companies} компани${s.unlisted_companies ? ` (+${s.unlisted_companies} бүртгэлгүй)` : ''} · ${s.people} хүн · ${s.organizations} байгууллага · ${s.ownerships} эзэмшил · ${s.positions} албан тушаал${s.beneficial_owners ? ` · ${s.beneficial_owners} эцсийн өмчлөгч` : ''}` +
      (s.past_positions || s.past_ownerships ? ` · түүх: ${s.past_positions} албан тушаал, ${s.past_ownerships} эзэмшил` : '') +
      (s.first_observed && s.first_observed !== s.last_observed ? ` (${s.first_observed} – ${s.last_observed})` : '');
    if (focusKey && s.companies) open(focusKey).catch(() => document.getElementById('btnOverview').click());
    else if (s.companies) document.getElementById('btnOverview').click();
  }).catch(() => document.getElementById('stats').textContent = 'Өгөгдлийн сан ачаалж байна…');
}

// While the data pipeline is running (hosted deployment), show its progress.
let lastState = null;
async function pollStatus() {
  let st;
  try { st = await api('/api/status'); } catch { return; }
  const box = document.getElementById('pipeline');
  if (!st || st.state === 'unknown') { box.textContent = ''; return; }
  const last = (st.steps || []).slice(-1)[0];
  box.textContent = st.state === 'done'
    ? (st.next_run ? `Дараагийн шинэчлэл: ${st.next_run.slice(0, 16).replace('T', ' ')} UTC` : '')
    : `Өгөгдөл шинэчилж байна: ${last ? last.step : st.state}…`;
  if (st.state !== lastState && (st.state === 'done' || lastState === null)) loadStats();
  lastState = st.state;
  if (st.state === 'running' || st.state === 'starting') setTimeout(pollStatus, 5000);
  else if (st.state === 'failed') box.textContent = 'Өгөгдөл ачаалахад алдаа гарлаа (logs-г шалгана уу).';
  if (st.next_run && st.state !== 'running') setTimeout(pollStatus, 60000);   // scheduled refreshes
}
loadStats(); pollStatus();
</script>
